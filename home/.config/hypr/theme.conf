# Theme Automation Configuration

# Sources to rotate through: space-separated list of "wallhaven", "reddit", "local"
WALLPAPER_SOURCES="wallhaven reddit local"

# Local Directory (for local source)
WALLPAPER_DIR="$HOME/Wallpapers"

# Wallhaven API URL (General category only [100 = no anime/people], SFW [100], 32:9 ratio, >= 5120x1440)
WALLPAPER_URL="https://wallhaven.cc/api/v1/search?categories=100&purity=100&ratios=32x9&atleast=5120x1440&sorting=random"

# Reddit RSS Search URL (r/WidescreenWallpaper 5120x1440 and 7680x2160 posts)
REDDIT_RSS_BASE="https://www.reddit.com/r/WidescreenWallpaper/search.rss?q=7680x2160+OR+5120x1440&restrict_sr=on&limit=100"

# GTK Settings
THEME_ICONS="Papirus-Dark"
THEME_CURSOR="Bibata-Modern-Classic"
THEME_FONT="FiraCode Nerd Font Mono"

# Wallust Theme: "Kanagawa-Wave" (default), any wallust theme, or "wallpaper"
WALLUST_THEME="Kanagawa-Wave"

# Logging
LOG_FILE="$HOME/.cache/theme-automation.log"

